    Experience:
      - company: EPFL -- Emergent Complexity in Physical Systems Lab (ECPS)
        position: Doctoral Researcher
        location: Lausanne, Switzerland
        start_date: 2021-09
        end_date: present
        highlights:
          - Developed open-source C++/Python software for nonlinear analysis of PDEs across fluid mechanics and photonics, enabling Newton-Krylov computations of exact solutions and bifurcation tracking at scale.
          - Reduced matrix inversion cost from O(N³) to O(N) by replacing direct solvers with Krylov subspace methods, enabling large-scale bifurcation computations infeasible with conventional approaches.
          - Extended this framework with an adjoint-based optimization scheme to compute time-periodic solutions of Hamiltonian PDEs, including the nonlinear Schrödinger equation.
          - Leveraged this framework in photonics demonstrating 10x threshold reduction for generating emergent soliton hopping in coupled microresonators, advancing chip-scale frequency-comb technology.
          - Applied data-driven dimensionality reduction with autoencoder neural networks to identify low-dimensional nonlinear embeddings of optical chaos.

      - company: NeuroRestore, Lausanne University Hospital (CHUV)
        position: Research Assistant
        location: Lausanne, Switzerland
        start_date: 2020-02
        end_date: 2020-12
        summary: Extended biophysical neural network models of spinal circuits with novel synaptic pathways; reproduced in-vivo EMG responses to high-frequency (≤1 kHz) epidural stimulation and identified candidate mechanisms to guide experimental design and stimulation protocols.

      - company: Acoustics & Dynamics Laboratory, Ohio State University
        position: Research Intern
        location: Columbus, USA
        start_date: 2018-05
        end_date: 2018-07
        summary: Developed numerical simulations of vibration isolators with a PSD-based metric for estimating nonlinear contributions, revealing peak nonlinearity at intermediate amplitudes (~0.01 mm) from elastic-friction interaction.

